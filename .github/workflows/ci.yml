name: CI check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: build frontend
        run: npm run build

      - name: check frontend types
        run: npx tsc --noEmit

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libssl-dev pkg-config libdbus-1-dev

      - name: check rust code
        working-directory: src-tauri
        run: cargo check --verbose
