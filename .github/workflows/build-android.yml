name: Build Android APK (Tauri v2)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish the APK under (for example v1.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: setup android sdk
        id: setup-android
        uses: android-actions/setup-android@v3

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: install dependencies
        run: npm install --legacy-peer-deps

      - name: create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > google-services.json

      - name: build frontend
        run: npm run build

      - name: initialize tauri android
        # Always run init --ci to ensure the Android project matches the current config
        run: npx tauri android init --ci

      - name: build android release
        run: npx tauri android build --apk
        env:
          NDK_HOME: ${{ steps.setup-android.outputs.ndk-path }}

      - name: decode keystore
        id: decode_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: 'release-key.jks'
          encodedString: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: sign apk
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found to sign!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          
          # Use apksigner from the Android SDK
          APKSIGNER_PATH=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -1)
          
          # Ensure the output directory exists
          mkdir -p src-tauri/gen/android/app/build/outputs/apk/release
          
          "$APKSIGNER_PATH" sign --ks ${{ steps.decode_keystore.outputs.filePath }} \
            --ks-pass pass:$KEYSTORE_PASSWORD \
            --ks-key-alias $KEY_ALIAS \
            --key-pass pass:$KEY_PASSWORD \
            --out src-tauri/gen/android/app/build/outputs/apk/release/MultiTableHero-signed.apk \
            "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiTableHero-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/release/MultiTableHero-signed.apk
          retention-days: 1

  publish-release:
    name: Publish Android app to GitHub Releases
    runs-on: ubuntu-latest
    needs: build-android
    concurrency:
      group: github-releases
      cancel-in-progress: false
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: MultiTableHero-Android-APK
          path: release-artifacts

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: MultiTable Hero ${{ inputs.release_tag }}
          files: release-artifacts/MultiTableHero-signed.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Keep only the latest three releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t old_releases < <(
            gh release list --limit 100 --json tagName,createdAt \
              --jq 'sort_by([.createdAt, .tagName]) | reverse | .[3:][] | .tagName'
          )
          for tag in "${old_releases[@]}"; do
            echo "Deleting old release and tag: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
